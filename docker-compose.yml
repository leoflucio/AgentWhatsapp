# Na VPS: copie .env.example para .env, preencha e rode `docker compose up -d --build`.
# O app fica em http://localhost:3000. Com APP_DOMAIN no .env (ex.: meuapp.com.br,
# já apontado para a VPS) e o Traefik da VPS rodando (resolver "letsencrypt"),
# o app ganha HTTPS nesse domínio; use https://APP_DOMAIN em PUBLIC_APP_URL.
services:
  app:
    build:
      context: .
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY}
    env_file: .env
    ports:
      - "3000:3000"
    restart: unless-stopped
    labels:
      # Sem APP_DOMAIN o Traefik ignora o app.
      - "traefik.enable=${APP_DOMAIN:+true}"
      - "traefik.http.routers.agente.rule=Host(`${APP_DOMAIN:-localhost}`)"
      - "traefik.http.routers.agente.entrypoints=websecure"
      - "traefik.http.routers.agente.tls.certresolver=letsencrypt"
      - "traefik.http.services.agente.loadbalancer.server.port=3000"
